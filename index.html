<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProBeing</title>
<meta name="description" content="Personal activity keeper.">
<meta name="theme-color" content="#101828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banner" class="banner" hidden></div>

<header class="top">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" class="brand-mark" width="34" height="34">
    <h1>ProBeing</h1>
  </div>
  <button id="settingsBtn" class="icon-btn" aria-label="Settings">&#9881;</button>
</header>

<p id="nowLine" class="now">&mdash;</p>

<main>
  <section class="actions">
    <button id="mBtn" class="m-btn" data-stage="3">
      <span class="m-letter">M</span>
      <span id="mCount" class="m-count">0 today</span>
    </button>

    <div class="action-row">
      <button id="prayerBtn" class="btn" data-stage="3">Prayer</button>
      <button id="micBtn" class="btn" data-stage="4">&#127908; Voice</button>
    </div>
  </section>

  <form id="trackerForm" class="tracker" autocomplete="off">
    <input id="trackerInput" type="text" placeholder="What are you working on?" aria-label="Log an activity">
    <button type="submit" class="btn btn-accent">Log</button>
  </form>

  <section class="log">
    <div class="log-head">
      <h2>Today</h2>
      <button id="refreshBtn" class="link-btn">Refresh</button>
    </div>
    <ul id="logList" class="log-list"><li class="empty">Not connected yet.</li></ul>
  </section>
</main>

<dialog id="settingsDlg" class="dlg">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <p class="hint">Stored only on this device, never in the code repo. Enter these once per device.</p>

    <label for="apiUrl">Apps Script Web App URL</label>
    <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>

    <label for="token">Secret token</label>
    <input id="token" type="password" placeholder="your TOKEN script property" required>

    <div class="dlg-actions">
      <button type="button" id="testBtn" class="btn">Test</button>
      <button type="button" id="cancelBtn" class="link-btn">Cancel</button>
      <button type="button" id="saveBtn" class="btn btn-accent">Save</button>
    </div>
    <p id="testResult" class="hint"></p>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
