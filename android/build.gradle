// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        // ADDED BY HAND, and `bubblewrap update` will drop it: the template ships
        // google() + jcenter(), and jcenter has been frozen since 2022. AGP's own
        // transitive dependencies are not all mirrored on Google's Maven, so
        // without this the build fails at dependency resolution, not at compile.
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()   // see the note in buildscript above
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
